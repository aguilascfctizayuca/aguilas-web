  while (stack.length){
    var seg = stack.pop(), a = seg[0], b = seg[1];
    if (b - a < 2) continue;
    var ax = closed[a][0], ay = closed[a][1], bx = closed[b][0], by = closed[b][1];
    var dx = bx - ax, dy = by - ay;
    var len = Math.sqrt(dx * dx + dy * dy) || 1e-6;
    var maxD = -1, maxI = -1;
    for (var i = a + 1; i < b; i++){
      var dd = Math.abs((closed[i][0] - ax) * dy - (closed[i][1] - ay) * dx) / len;
      if (dd > maxD){ maxD = dd; maxI = i; }
    }
    if (maxD > eps){ keep[maxI] = 1; stack.push([a, maxI]); stack.push([maxI, b]); }
  }
  var out = [];
  for (i = 0; i < n - 1; i++) if (keep[i]) out.push(closed[i]);
  return out;
}

function signedArea(pts){
  var a = 0;
  for (var i = 0, n = pts.length; i < n; i++){
    var p = pts[i], q = pts[(i + 1) % n];
    a += p[0] * q[1] - q[0] * p[1];
  }
  return a / 2;
}

function pointInPoly(px, py, pts){
  var inside = false;
  for (var i = 0, j = pts.length - 1; i < pts.length; j = i++){
    var xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / ((yj - yi) || 1e-9) + xi)) inside = !inside;
  }
  return inside;
}

function contoursOf(cv, step, eps, minArea, smoothIter, smoothAlpha, invScale){
  var loops = marchingSquares(gridFromCanvas(cv, step));
  var out = [];
  var s = (step || 1) / (invScale || 1);
  for (var i = 0; i < loops.length; i++){
    var pts = loops[i];
    if (smoothIter) pts = smoothLoop(pts, smoothIter, smoothAlpha || 0.5);
    pts = rdp(pts, eps);
    if (pts.length >= 3 && Math.abs(signedArea(pts)) >= minArea){
      if (s !== 1){
        for (var j = 0; j < pts.length; j++){ pts[j] = [pts[j][0] * s, pts[j][1] * s]; }
      }
      out.push(pts);
    }
  }
  return out;
}

function makeShapes(loops, cx, cy){
  var items = [];
  for (var i = 0; i < loops.length; i++){
    var pts = [];
    for (var j = 0; j < loops[i].length; j++){
      pts.push(new THREE.Vector2(loops[i][j][0] - cx, cy - loops[i][j][1]));
    }
    items.push({pts: pts, area: Math.abs(THREE.ShapeUtils.area(pts)), raw: loops[i], depth: 0});
  }
  for (i = 0; i < items.length; i++){
    var p0 = items[i].raw[0], depth = 0;
    for (j = 0; j < items.length; j++){
      if (i === j) continue;
      if (pointInPoly(p0[0], p0[1], items[j].raw)) depth++;
    }
    items[i].depth = depth;
  }
  var shapes = [];
  for (i = 0; i < items.length; i++){
    if (items[i].depth % 2 !== 0) continue;
    var arr = items[i].pts.slice();
    if (THREE.ShapeUtils.isClockWise(arr)) arr.reverse();
    var sh = new THREE.Shape(arr);
    sh.__area = items[i].area;
    sh.__raw = items[i].raw;
    shapes.push(sh);
  }
  for (i = 0; i < items.length; i++){
    if (items[i].depth % 2 === 0) continue;
    var best = null, bestArea = Infinity;
    var hp = items[i].raw[0];
    for (j = 0; j < shapes.length; j++){
      if (shapes[j].__area > items[i].area && shapes[j].__area < bestArea && pointInPoly(hp[0], hp[1], shapes[j].__raw)){
        best = shapes[j]; bestArea = shapes[j].__area;
      }
    }
    if (best){
      var harr = items[i].pts.slice();
      if (!THREE.ShapeUtils.isClockWise(harr)) harr.reverse();
      best.holes.push(new THREE.Path(harr));
    }
  }
  return shapes;
}

function loopsBBox(loops){
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (var i = 0; i < loops.length; i++){
    for (var j = 0; j < loops[i].length; j++){
      var p = loops[i][j];
      if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
    }
  }
  return {x0: x0, y0: y0, x1: x1, y1: y1, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0};
}

/* ------------------------------------------------------------ rastering */
function makeCanvas(w, h){
  var c = document.createElement('canvas');
  c.width = Math.max(4, Math.ceil(w));
  c.height = Math.max(4, Math.ceil(h));
  return c;
}
function prepCtx(c){
  var ctx = c.getContext('2d', {willReadFrequently: true});
  ctx.font = fontString();
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#fff';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.miterLimit = 2;
  return ctx;
}

/* one COMMON pad for every raster of a glyph keeps all contour spaces aligned.
   ss > 1 supersamples the raster for crisper contour extraction. */
function rasterGlyph(ch, w, mode, r, pad, ss){
  ss = ss || 1;
  var cv = makeCanvas((w + 2 * pad) * ss, (FONT_PX * 1.6 + 2 * pad) * ss);
  var ctx = cv.getContext('2d', {willReadFrequently: true});
  ctx.font = '900 ' + (FONT_PX * ss) + 'px ' + fontStack();
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#fff';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.miterLimit = 2;
  var bx = pad * ss, by = (pad + FONT_PX * 1.1) * ss;
  if (mode === 'erode'){
    ctx.fillText(ch, bx, by);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 2 * r * ss;
    ctx.strokeText(ch, bx, by);
  } else {
    if (r > 0){ ctx.lineWidth = 2 * r * ss; ctx.strokeText(ch, bx, by); }
    ctx.fillText(ch, bx, by);
  }
  return {canvas: cv, bx: pad, by: pad + FONT_PX * 1.1};
}

/* --------------------------------------------------------------- build */
function disposeRoot(g){
  if (!g) return;
  g.traverse(function(o){ if (o.geometry) o.geometry.dispose(); });
}

function buildAll(){
  try {
    var textRaw = String(readCfg('text', 'STAY/WILD'));
    var lines = textRaw.split('/').map(function(s){ return s.replace(/^\s+|\s+$/g, ''); }).filter(function(s){ return s.length; });
    if (!lines.length) lines = ['STAY'];
    var ls = readCfg('letter_spacing', 1.04);
    var lineH = FONT_PX * readCfg('line_spacing', 1.02);
    var Dl = readCfg('letter_depth', 0.22) * FONT_PX;
    var strokeR = readCfg('stroke_width', 0.045) * FONT_PX;
    var auraR = Math.max(2, readCfg('aura_size', 0.13) * FONT_PX);
    var Da = readCfg('aura_depth', 0.32) * FONT_PX;
    var outW = strokeR > 0.5 ? Math.max(4, strokeR * 1.3) : 0;
    var gpad = Math.ceil(auraR + outW + 16);

    var mc = makeCanvas(8, 8);
    var mctx = prepCtx(mc);

    /* measure lines */
    var lineData = [];
    var maxW = 0;
    for (var li = 0; li < lines.length; li++){
      var chars = lines[li].split('');
      var widths = [], total = 0;
      for (var ci = 0; ci < chars.length; ci++){
        var w = mctx.measureText(chars[ci]).width;
        widths.push(w);
        total += w * ls;
      }
      if (chars.length) total -= widths[widths.length - 1] * (ls - 1);
      lineData.push({chars: chars, widths: widths, w: total});
      if (total > maxW) maxW = total;
    }

    var margin = gpad + 20;
    var blockW = Math.ceil(maxW + 2 * margin);

    /* letter entries in block coords */
    var entries = [];
    for (li = 0; li < lineData.length; li++){
      var Ld = lineData[li];
      var baseY = margin + FONT_PX * 1.05 + li * lineH;
      var cursor = (blockW - Ld.w) / 2;
      for (ci = 0; ci < Ld.chars.length; ci++){
        var ch = Ld.chars[ci];
        if (ch !== ' '){
          entries.push({ch: ch, x: cursor, y: baseY, w: Ld.widths[ci], li: li});
        }
        cursor += Ld.widths[ci] * ls;
      }
    }
    if (!entries.length) return;

    /* pass 1: rasterize + contour every glyph, in one shared coord space */
    var parts = [];
    var uMinX = Infinity, uMaxX = -Infinity, uMinY = Infinity, uMaxY = -Infinity;
    for (var i = 0; i < entries.length; i++){
      var e = entries[i];
      var fillR = rasterGlyph(e.ch, e.w, 'fill', 0, gpad, 2);
      var fillLoops = contoursOf(fillR.canvas, 1, 0.7, 60, 1, 0.5, 2);
      if (!fillLoops.length) continue;
      var lb = loopsBBox(fillLoops);
      var cx = lb.cx, cy = lb.cy;

      var auraLoops = contoursOf(rasterGlyph(e.ch, e.w, 'dilate', auraR, gpad, 1).canvas, 2, 0.3, 10, 2, 0.5, 1);
      var ringOutLoops = outW > 0 ? contoursOf(rasterGlyph(e.ch, e.w, 'dilate', auraR + outW, gpad, 1).canvas, 2, 0.3, 10, 2, 0.5, 1) : [];
      var ringInLoops = outW > 0 ? contoursOf(rasterGlyph(e.ch, e.w, 'dilate', Math.max(0.5, auraR - 2), gpad, 1).canvas, 2, 0.3, 10, 2, 0.5, 1) : [];
      var dilLoops = null, eroLoops = null;
      if (strokeR > 0.5){
        dilLoops = contoursOf(rasterGlyph(e.ch, e.w, 'dilate', strokeR, gpad, 2).canvas, 1, 0.7, 60, 2, 0.55, 2);
        eroLoops = contoursOf(rasterGlyph(e.ch, e.w, 'erode', 3, gpad, 2).canvas, 1, 0.7, 60, 2, 0.55, 2);
      }

      /* block-space center of this glyph's ink */
      var bx = e.x + (cx - fillR.bx);
      var by = e.y + (cy - fillR.by);

      /* union extents from the widest silhouette (ring outer or aura) */
      var extLoops = ringOutLoops.length ? ringOutLoops : auraLoops;
      var eb = loopsBBox(extLoops);
      var lminX = eb.x0 - cx, lmaxX = eb.x1 - cx;
      var lminY = cy - eb.y1, lmaxY = cy - eb.y0;
      if (bx + lminX < uMinX) uMinX = bx + lminX;
      if (bx + lmaxX > uMaxX) uMaxX = bx + lmaxX;
      if (by - lmaxY < uMinY) uMinY = by - lmaxY;
      if (by - lminY > uMaxY) uMaxY = by - lminY;

      parts.push({e: e, cx: cx, cy: cy, bx: bx, by: by,
        fillLoops: fillLoops, auraLoops: auraLoops,
        ringOutLoops: ringOutLoops, ringInLoops: ringInLoops,
        dilLoops: dilLoops, eroLoops: eroLoops});
    }
    if (!parts.length) return;

    var acx = (uMinX + uMaxX) / 2;
    var acy = (uMinY + uMaxY) / 2;

    /* z stack (letter-local): stroke plate proud front, letter, aura chunk, aura outline.
       Each chunk face gets a tiny unique depth so coplanar overlaps never alias,
       and every outline ring sits behind ALL faces: it only shows around the union. */
    var zA = -(Dl + 3);
    var dzStep = 0.35;
    var dzAll = -dzStep * (parts.length - 1);
    var rd = outW > 0 ? Math.max(4, Math.min(outW * 1.4, Da * 0.8)) : 0;
    var zRingTop = zA + dzAll - 0.5;
    var zTop = 1.5;
    var zBot = Math.min(zA + dzAll - Da, zRingTop - rd) - 1;
    var zMid = (zTop + zBot) / 2;

    var newRoot = new THREE.Group();
    var hitList = [];
    var newLetters = [];

    for (i = 0; i < parts.length; i++){
      var P = parts[i];
      var bodyShapes = makeShapes(P.fillLoops, P.cx, P.cy);
      if (!bodyShapes.length) continue;

      var g = new THREE.Group();
      g.position.set(P.bx - acx, acy - P.by, zMid);

      /* letter body */
      var body = new THREE.Mesh(new THREE.ExtrudeGeometry(bodyShapes, {depth: Dl, bevelEnabled: false}), [matLetterFace, matLetterSide]);
      body.position.z = -Dl - zMid;
      body.userData.li = i;
      g.add(body);
      hitList.push(body);

      /* true stroke ring, proud of the face */
      if (P.dilLoops && P.eroLoops && P.dilLoops.length && P.eroLoops.length){
        var strokeShapes = makeShapes(P.dilLoops.concat(P.eroLoops), P.cx, P.cy);
        if (strokeShapes.length){
          var sd = Math.max(3, Math.min(strokeR * 1.4, Math.max(4, Dl * 0.7)));
          var ring = new THREE.Mesh(new THREE.ExtrudeGeometry(strokeShapes, {depth: sd, bevelEnabled: false}), [matStroke, matStroke]);
          ring.position.z = 1.4 - sd - zMid;
          ring.userData.li = i;
          g.add(ring);
          hitList.push(ring);
          /* crisp face cap above the stroke plate: the visible letter/stroke
             boundary is the clean glyph contour, not the plate's inner edge */
          var faceCap = new THREE.Mesh(new THREE.ShapeGeometry(bodyShapes), matLetterFace);
          faceCap.position.z = 2.0 - zMid;
          faceCap.userData.li = i;
          g.add(faceCap);
        }
      }

      /* aura chunk — spins with its letter */
      var dz = -dzStep * i;
      var auraShapes = makeShapes(P.auraLoops, P.cx, P.cy);
      if (auraShapes.length){
        var auraMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(auraShapes, {depth: Da, bevelEnabled: false}), [matAuraFace, matAuraSide]);
        auraMesh.position.z = zA + dz - Da - zMid;
        auraMesh.userData.li = i;
        g.add(auraMesh);
        hitList.push(auraMesh);
        /* flat cap above every chunk face: swallows hairline wall slivers
           where neighboring chunks merge, keeping the union seamless */
        var capMesh = new THREE.Mesh(new THREE.ShapeGeometry(auraShapes), matAuraFace);
        capMesh.position.z = zA + 0.25 + 0.02 * i - zMid;
        capMesh.userData.li = i;
        g.add(capMesh);
      }

      /* aura outline sits just BEHIND aura faces: visible only around the
         union silhouette, so merged chunks read as one contoured sticker */
      if (outW > 0 && P.ringOutLoops.length && P.ringInLoops.length){
        var ringShapes = makeShapes(P.ringOutLoops.concat(P.ringInLoops), P.cx, P.cy);
        if (ringShapes.length){
          var oMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(ringShapes, {depth: rd, bevelEnabled: false}), [matAuraSide, matAuraSide]);
          oMesh.position.z = zRingTop - rd - zMid;
          oMesh.userData.li = i;
          g.add(oMesh);
        }
      }

      newRoot.add(g);
      newLetters.push({group: g, r: 0, rv: 0, rt: 0, s: 1, sv: 0});
    }

    /* swap */
    if (root){ scene.remove(root); disposeRoot(root); }
    root = newRoot;
    scene.add(root);
    letters = newLetters;
    letterHitMeshes = hitList;
    pendingSpins = [];
    hoverIdx = -1;

    bounds = {
      hw: Math.max(40, (uMaxX - uMinX) / 2 + 8),
      hh: Math.max(40, (uMaxY - uMinY) / 2 + 8),
      zmin: zBot - 5,
      zmax: zTop + 5
    };
    fitCamera();
  } catch (err){
    if (!warnedBuild){ console.warn('build', err); warnedBuild = true; }
  }
}

function scheduleRebuild(){
  if (rebuildTimer) clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(function(){ rebuildTimer = null; buildAll(); }, 140);
}

/* --------------------------------------------------------------- camera */
function fitCamera(){
  if (!camera) return;
  var cz = (bounds.zmin + bounds.zmax) / 2;
  var center = new THREE.Vector3(0, 0, cz);
  var elC = Math.max(-1.1, Math.min(1.1, el));
  var dir = new THREE.Vector3(Math.cos(elC) * Math.sin(az), Math.sin(elC), Math.cos(elC) * Math.cos(az));
  camera.position.copy(center).addScaledVector(dir, 1800);
  camera.up.set(0, 1, 0);
  camera.lookAt(center);
  camera.updateMatrixWorld(true);
  var rv = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
  var uv = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
  var halfW = 0, halfH = 0;
  var v = new THREE.Vector3();
  for (var sx = -1; sx <= 1; sx += 2){
    for (var sy = -1; sy <= 1; sy += 2){
      for (var sz = 0; sz <= 1; sz++){
        v.set(sx * bounds.hw, sy * bounds.hh, (sz ? bounds.zmax : bounds.zmin) - cz);
        var pw = Math.abs(v.dot(rv)), ph = Math.abs(v.dot(uv));
        if (pw > halfW) halfW = pw;
        if (ph > halfH) halfH = ph;
      }
    }
  }
  var aspect = window.innerWidth / Math.max(1, window.innerHeight);
  var z = Math.max(0.05, readCfg('zoom', 1) * wheelZoom);
  var vh = Math.max(halfH, halfW / aspect) * 1.09 / z;
  camera.top = vh; camera.bottom = -vh;
  camera.left = -vh * aspect; camera.right = vh * aspect;
  camera.near = 1; camera.far = 5000;
  camera.updateProjectionMatrix();
}

/* --------------------------------------------------------------- motion */
function triggerSpin(idx){
  var l = letters[idx];
  if (!l) return;
  l.rt -= Math.PI * 2;
  l.sv += readCfg('pop_amount', 0.12) * 9;
}

function triggerWave(){
  var now = performance.now();
  var stag = readCfg('spin_stagger', 0.12) * 1000;
  for (var i = 0; i < letters.length; i++){
    pendingSpins.push({t: now + i * stag, idx: i});
  }
}

/* ---------------------------------------------------------------- input */
function setupInput(cv){
  var raycaster = new THREE.Raycaster();
  var ndc = new THREE.Vector2();

  cv.addEventListener('pointermove', function(e){
    if (!letterHitMeshes.length || !camera) return;
    var r = cv.getBoundingClientRect();
    ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    var hits = raycaster.intersectObjects(letterHitMeshes, false);
    var idx = hits.length ? hits[0].object.userData.li : -1;
    if (idx !== hoverIdx){
      hoverIdx = idx;
      if (idx >= 0) triggerSpin(idx);
    }
  });
  cv.addEventListener('pointerleave', function(){ hoverIdx = -1; });
}

/* ----------------------------------------------------------------- loop */
var lastT = 0;
function frame(now){
  requestAnimationFrame(frame);
  try {
    var dt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
    lastT = now;

    if (readCfg('auto_spin', true) && letters.length){
      if (now > nextWaveAt){
        triggerWave();
        nextWaveAt = now + readCfg('spin_interval', 3.5) * 1000;
      }
    } else {
      nextWaveAt = Math.max(nextWaveAt, now + 400);
    }
    if (pendingSpins.length){
      var rest = [];
      for (var i = 0; i < pendingSpins.length; i++){
        if (pendingSpins[i].t <= now) triggerSpin(pendingSpins[i].idx);
        else rest.push(pendingSpins[i]);
      }
      pendingSpins = rest;
    }

    var spd = readCfg('spin_speed', 1);
    var k = 90 * Math.pow(spd, 1.7) + 18;
    var c = 2 * Math.sqrt(k) * 0.74;
    var axis = readCfg('spin_axis', 'flip');
    for (i = 0; i < letters.length; i++){
      var l = letters[i];
      l.rv += (l.rt - l.r) * k * dt - c * l.rv * dt;
      l.r += l.rv * dt;
      var k2 = 150, c2 = 2 * Math.sqrt(k2) * 0.34;
      l.sv += (1 - l.s) * k2 * dt - c2 * l.sv * dt;
      l.s += l.sv * dt;
      if (axis === 'spin'){
        l.group.rotation.x = 0;
        l.group.rotation.y = l.r;
      } else {
        l.group.rotation.y = 0;
        l.group.rotation.x = l.r;
      }
      l.group.scale.setScalar(Math.max(0.2, l.s));
    }

    if (!dragging){
      az += azv * dt;
      el += elv * dt;
      el = Math.max(-1.1, Math.min(1.1, el));
      azv *= Math.exp(-3.2 * dt);
      elv *= Math.exp(-3.2 * dt);
    }

    if (root){
      var sw = readCfg('idle_sway', 0.5);
      var t = now / 1000;
      root.rotation.y = sw * 0.045 * Math.sin(t * 0.42);
      root.rotation.x = sw * 0.028 * Math.cos(t * 0.31);
    }

    fitCamera();
    renderer.render(scene, camera);
  } catch (err){
    if (!warnedFrame){ console.warn('frame', err); warnedFrame = true; }
  }
}

/* -------------------------------------------------------------- colors */
function applyColors(){
  matLetterFace.color.set(readCfg('letter_color', '#FF4F30'));
  matLetterSide.color.set(readCfg('side_color', '#23140F'));
  matStroke.color.set(readCfg('stroke_color', '#FFF4E4'));
  matAuraFace.color.set(readCfg('aura_color', '#FFC93C'));
  matAuraSide.color.set(readCfg('aura_side_color', '#23140F'));
  applyBackground();
}
function applyBackground(){
  if (readCfg('background_filled', true)){
    scene.background = new THREE.Color(readCfg('background_color', '#F4ECDF'));
  } else {
    scene.background = null;
  }
}

/* ---------------------------------------------------------------- init */
function init(){
  renderer = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, true);
  renderer.domElement.id = 'c';
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 5000);

  matLetterFace = new THREE.MeshBasicMaterial({color: '#FF4F30'});
  matLetterSide = new THREE.MeshBasicMaterial({color: '#23140F'});
  matStroke = new THREE.MeshBasicMaterial({color: '#FFF4E4'});
  matAuraFace = new THREE.MeshBasicMaterial({color: '#FFC93C'});
  matAuraSide = new THREE.MeshBasicMaterial({color: '#23140F'});

  applyColors();
  setupInput(renderer.domElement);
  buildAll();
  nextWaveAt = performance.now() + 900;

  window.addEventListener('resize', function(){
    renderer.setSize(window.innerWidth, window.innerHeight, true);
    fitCamera();
  });

  if (document.fonts){
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', scheduleRebuild);
    try { document.fonts.load(fontString(), 'HW').then(scheduleRebuild); } catch(e){}
  }
  var T = window.__VISU_TYPOGRAPHY_RUNTIME;
  if (T && T.subscribe){ try { T.subscribe(function(){ scheduleRebuild(); }); } catch(e){} }

  requestAnimationFrame(frame);
}

/* --------------------------------------------------------------- bridge */
var REBUILD_KEYS = {text: 1, letter_spacing: 1, line_spacing: 1, letter_depth: 1, stroke_width: 1, aura_size: 1, aura_depth: 1};

function applyKey(key, value){
  if (!cfg[key]){ cfg[key] = {value: value}; }
  else {
    if (cfg[key].value === value) return;
    cfg[key].value = value;
  }
  if (REBUILD_KEYS[key]) scheduleRebuild();
  else if (key === 'zoom') fitCamera();
  else if (key.indexOf('color') >= 0 || key === 'background_filled') applyColors();
}

window.addEventListener('message', function(e){
  if (!e.data) return;
  var d = e.data;
  if (d.type === 'cfg_update'){
    if (typeof d.key === 'string') applyKey(d.key, d.value);
    else if (d.cfg){
      for (var k in d.cfg){
        var v = d.cfg[k];
        applyKey(k, (v && typeof v === 'object' && 'value' in v) ? v.value : v);
      }
    }
  }
  if (d.type === 'visu_control_action'){
    if (d.key === 'play_wave') triggerWave();
    if (d.key === 'reset_view'){
      az = 0.30; el = 0.20; azv = 0; elv = 0; wheelZoom = 1;
      fitCamera();
    }
  }
  if (d.type === 'request_snapshot'){
    try {
      renderer.render(scene, camera);
      var cv = document.getElementById('c');
      if (cv) parent.postMessage({type: 'snapshot_ready', dataUrl: cv.toDataURL('image/png')}, '*');
    } catch (err){}
  }
});

window.addEventListener('load', function(){
  parent.postMessage({type: 'cfg_schema', cfg: cfg}, '*');
});

init();
</script>
</body>
</html>
